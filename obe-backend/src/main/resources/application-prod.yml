server:
  port: ${SERVER_PORT:8010}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/xml,text/css,application/javascript
    min-response-size: 1024
  servlet:
    context-path: /api/v1

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dypiu_obe_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate} # Strictly validate schema against Flyway migrations
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: true # Production safeguard: prevent accidental flyway:clean
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true} # Allow flexibility across OS line endings
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET} # Fail-fast: required in production
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    local-dir: ${LOCAL_STORAGE_PATH:/app/storage}
  reports:
    storage:
      dir: ${REPORTS_STORAGE_PATH:${LOCAL_STORAGE_PATH:/app/storage}/reports}
  upload-dir: ${APP_UPLOAD_DIR:${UPLOAD_STORAGE_PATH:/app/uploads}}
  upload:
    dir: ${UPLOAD_STORAGE_PATH:${APP_UPLOAD_DIR:/app/uploads}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pbas.dypiu.ac.in,http://10.100.0.23,http://150.129.156.37,http://localhost:3010,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.dypiu.nba: INFO
    org.springframework.security: INFO

