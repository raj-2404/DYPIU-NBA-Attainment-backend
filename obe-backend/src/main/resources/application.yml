server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/xml,text/css,application/javascript
    min-response-size: 1024
  servlet:
    context-path: /api/v1

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: obe-backend
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dypiu_obe_db}
    username: ${DATABASE_USERNAME:rajshaikh}
    password: ${DATABASE_PASSWORD:Sam@2445}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway is mandatory authority for DB schema evolution
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:dypiu_nba_attainment_system_super_secret_jwt_key_2026_java21_spring_boot_production_key}
    expiration-ms: 86400000 # 24 hours (Access Token)
    refresh-expiration-ms: 604800000 # 7 days (Refresh Token)
  storage:
    local-dir: ${LOCAL_STORAGE_PATH:./storage}
  reports:
    storage:
      dir: ${REPORTS_STORAGE_PATH:${LOCAL_STORAGE_PATH:./storage}/reports}
  upload-dir: ${APP_UPLOAD_DIR:${UPLOAD_STORAGE_PATH:./uploads}}
  upload:
    dir: ${UPLOAD_STORAGE_PATH:${APP_UPLOAD_DIR:./uploads}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pbas.dypiu.ac.in,http://10.100.0.23,http://150.129.156.37,http://localhost:3010,http://localhost:5173,*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.dypiu.nba: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.transaction: INFO
    org.springframework.orm.jpa: INFO
    org.springframework.security: INFO
